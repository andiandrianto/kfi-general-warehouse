    &lt;script&gt;
        const STORAGE_KEY_PRODUCTS = 'admin_inv_products_v3';
        const STORAGE_KEY_REQUESTS = 'admin_inv_requests_v3';
        const STORAGE_KEY_REMEMBER = 'gw_remember_user_v1';
        const STORAGE_KEY_SESSION = 'gw_logged_in_session_v1';
        const STORAGE_KEY_USERS = 'gw_users_sheet_v1';
        const STORAGE_KEY_WEBAPP_URL = 'gw_shared_webapp_url_v1';
        const STORAGE_KEY_OPNAME = 'admin_inv_opname_v1';

        const SHEET_ID = '109tZGlVTUuZBjEelw0sCBzCmuCBoNjCjb-cbTatKlMw';
        const SHEET_NAME = 'Inventory';
        const REQUESTS_SHEET_NAME = 'Permintaan';
        const OPNAME_SHEET_NAME = 'Stok Opname';
        const USER_SHEET_NAME = 'User';
        const DEFAULT_APPS_SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyIEXPt7cvv3ustCrGa8wMfctpaDuvw89dDZPImjHy2wV9kHBprvonOXwbsO3NGCr4/exec';
        const APPS_SCRIPT_WEB_APP_URL = DEFAULT_APPS_SCRIPT_WEB_APP_URL;

        function getSharedWebAppUrl() {
            try {
                const savedUrl = (localStorage.getItem(STORAGE_KEY_WEBAPP_URL) || '').trim();
                return savedUrl || DEFAULT_APPS_SCRIPT_WEB_APP_URL.trim();
            } catch (e) {
                return DEFAULT_APPS_SCRIPT_WEB_APP_URL.trim();
            }
        }

        function setSharedWebAppUrl(url) {
            const clean = String(url || '').trim();
            try {
                if (clean) {
                    localStorage.setItem(STORAGE_KEY_WEBAPP_URL, clean);
                } else {
                    localStorage.removeItem(STORAGE_KEY_WEBAPP_URL);
                }
            } catch (e) {
                console.error(e);
            }
            updateSharedStorageStatusUI();
        }

        function updateSharedStorageStatusUI() {
            const activeUrl = getSharedWebAppUrl();
            const isConnected = Boolean(activeUrl);
            const sidebarBadge = document.getElementById('shared-sync-status-badge');
            const catalogIndicator = document.getElementById('catalog-shared-indicator');
            const modalStatusText = document.getElementById('shared-upload-status-text');

            if (sidebarBadge) {
                sidebarBadge.className = isConnected
                    ? 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 cursor-pointer hover:bg-emerald-500/30 transition'
                    : 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-400/30 cursor-pointer hover:bg-amber-500/30 transition';
                sidebarBadge.innerHTML = isConnected
                    ? `&lt;span class=&quot;w-1.5 h-1.5 rounded-full bg-emerald-400&quot;&gt;&lt;/span&gt;&lt;span&gt;Cloud Aktif&lt;/span&gt;`
                    : `&lt;span class=&quot;w-1.5 h-1.5 rounded-full bg-amber-400&quot;&gt;&lt;/span&gt;&lt;span&gt;Lokal Saja&lt;/span&gt;`;
            }

            if (catalogIndicator) {
                catalogIndicator.className = isConnected
                    ? 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition cursor-pointer'
                    : 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 transition cursor-pointer';
                catalogIndicator.innerHTML = isConnected
                    ? `&lt;i data-lucide=&quot;cloud-check&quot; class=&quot;w-3 h-3&quot;&gt;&lt;/i&gt;&lt;span&gt;Foto Bersama Aktif&lt;/span&gt;`
                    : `&lt;i data-lucide=&quot;cloud&quot; class=&quot;w-3 h-3&quot;&gt;&lt;/i&gt;&lt;span&gt;Mode Lokal&lt;/span&gt;`;
            }

            if (modalStatusText) {
                modalStatusText.textContent = isConnected
                    ? 'Status: Terhubung ke Penyimpanan Bersama'
                    : 'Status: Belum dikonfigurasi (Lokal saja)';
            }

            if (window.lucide) lucide.createIcons();
        }

        function openSharedStorageModal() {
            const modal = document.getElementById('shared-storage-modal');
            const input = document.getElementById('shared-webapp-url');
            if (input) input.value = getSharedWebAppUrl();
            updateSharedStorageStatusUI();
            if (modal) modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeSharedStorageModal() {
            const modal = document.getElementById('shared-storage-modal');
            if (modal) modal.classList.add('hidden');
        }

        async function handleSaveSharedStorageConfig(event) {
            if (event) event.preventDefault();
            const input = document.getElementById('shared-webapp-url');
            const urlVal = (input ? input.value : '').trim();
            setSharedWebAppUrl(urlVal);
            closeSharedStorageModal();

            if (urlVal) {
                showToast('Konfigurasi Penyimpanan Bersama disimpan. Menyinkronkan katalog...', 'success');
                await syncProductsFromSpreadsheet(true);
            } else {
                showToast('Mode penyimpanan lokal diaktifkan', 'success');
            }
        }

        async function uploadImageToSharedStorage(product, dataUrl) {
            const webAppUrl = getSharedWebAppUrl();
            if (!webAppUrl) {
                return {
                    shared: false,
                    imageUrl: dataUrl,
                    reason: 'URL Penyimpanan Bersama belum diatur'
                };
            }

            try {
                const actor = getCurrentOpnameActorName();
                const payload = {
                    action: 'uploadProductImage',
                    sheetId: SHEET_ID,
                    sheetName: SHEET_NAME,
                    productId: product?.id || '',
                    sku: product?.sku || '',
                    productName: product?.name || '',
                    imageDataUrl: dataUrl,
                    uploadedBy: actor,
                    uploadedAt: getFormattedNow()
                };

                const res = await fetch(webAppUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const result = await res.json().catch(() =&gt; ({}));
                const sharedUrl = String(
                    result.imageUrl ||
                    result.url ||
                    result.publicUrl ||
                    result.data?.imageUrl ||
                    result.data?.url ||
                    ''
                ).trim();

                if (result.success === false) {
                    throw new Error(result.message || result.error || 'Server menolak upload foto');
                }

                return {
                    shared: true,
                    imageUrl: sharedUrl || dataUrl,
                    message: result.message || 'Foto tersimpan ke penyimpanan bersama'
                };
            } catch (err) {
                console.warn('Gagal mengunggah foto ke penyimpanan bersama:', err);
                return {
                    shared: false,
                    imageUrl: dataUrl,
                    reason: err.message || 'Gagal menghubungi endpoint penyimpanan bersama'
                };
            }
        }

        const CATALOG_BATCH_SIZE = 60;
        const OPNAME_BATCH_SIZE = 80;

        function createSvgPlaceholder(bgHex, textHex, label) {
            const safeLabel = String(label || 'ITEM').slice(0, 12);
            const svg = `&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;160&quot; height=&quot;160&quot; viewBox=&quot;0 0 160 160&quot;&gt;
                &lt;rect width=&quot;160&quot; height=&quot;160&quot; rx=&quot;24&quot; fill=&quot;${bgHex}&quot;/&gt;
                &lt;text x=&quot;80&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; dominant-baseline=&quot;middle&quot; font-family=&quot;Inter, Arial, sans-serif&quot; font-size=&quot;22&quot; font-weight=&quot;700&quot; fill=&quot;${textHex}&quot;&gt;${safeLabel}&lt;/text&gt;
            &lt;/svg&gt;`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function createWarehouseLogoSvg() {

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&amp;/g, '&amp;amp;')
                .replace(/&lt;/g, '&amp;lt;')
                .replace(/&gt;/g, '&amp;gt;')
                .replace(/&quot;/g, '&amp;quot;')
                .replace(/'/g, '&amp;#39;');
        }

        function escapeAttr(str) {
            return String(str ?? '')
                .replace(/\\/g, '\\\\')

        function getFormattedNow() {
            const now = new Date();
            const pad = (n) =&gt; String(n).padStart(2, '0');
            return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        }

        function formatDisplayDateTime(rawVal) {
            if (!rawVal) return '';
            const rawStr = String(rawVal).trim();
            if (!rawStr) return '';

            // Jika sudah berformat YYYY-MM-DD HH:mm (atau HH:mm:ss), pertahankan agar konsisten
            const alreadyFormatted = rawStr.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})(?::\d{2})?$/);
            if (alreadyFormatted) {
                return `${alreadyFormatted[1]} ${alreadyFormatted[2]}`;
            }

            const parsed = parseDateFlexible(rawStr);
            if (!parsed) return rawStr;

            const pad = (n) =&gt; String(n).padStart(2, '0');
            return `${parsed.getFullYear()}-${pad(parsed.getMonth() + 1)}-${pad(parsed.getDate())} ${pad(parsed.getHours())}:${pad(parsed.getMinutes())}`;
        }

        async function sha256Hex(plainText) {
            const text = String(plainText ?? '');
            if (window.crypto &amp;&amp; window.crypto.subtle &amp;&amp; window.TextEncoder) {
                const buf = new TextEncoder().encode(text);
                const digest = await window.crypto.subtle.digest('SHA-256', buf);
                return [...new Uint8Array(digest)]
                    .map((b) =&gt; b.toString(16).padStart(2, '0'))
                    .join('');
            }
            return text;
        }

        function parseDateFlexible(rawVal) {
            if (!rawVal) return null;
            if (rawVal instanceof Date) return Number.isNaN(rawVal.getTime()) ? null : rawVal;

            const str = String(rawVal).trim();
            if (!str) return null;

            const ddmmyyyyMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
            if (ddmmyyyyMatch) {
                const day = parseInt(ddmmyyyyMatch[1], 10);
                const month = parseInt(ddmmyyyyMatch[2], 10) - 1;
                const year = parseInt(ddmmyyyyMatch[3], 10);
                const hour = parseInt(ddmmyyyyMatch[4] || '23', 10);
                const min = parseInt(ddmmyyyyMatch[5] || '59', 10);
                const sec = parseInt(ddmmyyyyMatch[6] || '59', 10);
                const dt = new Date(year, month, day, hour, min, sec);
                return Number.isNaN(dt.getTime()) ? null : dt;
            }

            const parsed = new Date(str);
            return Number.isNaN(parsed.getTime()) ? null : parsed;
        }

        async function syncUsersFromSpreadsheet(notify = false) {
            const webAppUrl = getSharedWebAppUrl();
            if (webAppUrl) {
                try {
                    const sep = webAppUrl.includes('?') ? '&amp;' : '?';
                    const res = await fetch(`${webAppUrl}${sep}action=getUsers&amp;sheet=${encodeURIComponent(USER_SHEET_NAME)}&amp;_=${Date.now()}`, {
                        cache: 'no-store'
                    });
                    if (res.ok) {
                        const payload = await res.json();
                        const rows = Array.isArray(payload) ? payload : (payload.data || payload.rows || []);
                        const mapped = rows.map((r) =&gt; mapSheetRowToUser(r)).filter(Boolean);
                        if (mapped.length &gt; 0) {
                            usersList = mapped;
                            saveUsersToStorage();
                            renderUsersTable();
                            if (notify) {
                                showToast(`Data user disinkronkan dari sheet &quot;${USER_SHEET_NAME}&quot; (${mapped.length} user)`, 'success');
                            }
                            return true;
                        }
                    }
                } catch (e) {
                    console.warn('Gagal memuat daftar user via Web App:', e);
                }
            }

            try {
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&amp;sheet=${encodeURIComponent(USER_SHEET_NAME)}&amp;_=${Date.now()}`;
                const res = await fetch(csvUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                const lines = text.split(/\r?\n/).filter((l) =&gt; l.trim().length &gt; 0);
                if (lines.length &lt; 2) {
                    if (notify) showToast(`Sheet &quot;${USER_SHEET_NAME}&quot; kosong`, 'error');
                    return false;
                }
                const headers = parseCsvLine(lines[0]).map((h) =&gt; h.trim());
                const mapped = lines
                    .slice(1)
                    .map((line) =&gt; {
                        const vals = parseCsvLine(line);
                        const rowObj = {};
                        headers.forEach((h, i) =&gt; {
                            rowObj[h] = vals[i] ?? '';
                        });
                        return mapSheetRowToUser(rowObj);
                    })
                    .filter(Boolean);

                if (mapped.length &gt; 0) {
                    usersList = mapped;
                    saveUsersToStorage();
                    renderUsersTable();
                    if (notify) {
                        showToast(`Data user dimuat dari sheet &quot;${USER_SHEET_NAME}&quot; (${mapped.length} user)`, 'success');
                    }
                    return true;
                }
            } catch (err) {
                console.warn('Gagal memuat daftar user via CSV:', err);
            }

            if (notify) {
                showToast(`Menggunakan data user tersimpan (${usersList.length} user)`, 'success');
            }
            return false;
        }

        function setupViewportKeyboardHandler() {
            const syncViewportHeight = () =&gt; {
                const vv = window.visualViewport;
                const heightPx = vv &amp;&amp; vv.height ? Math.round(vv.height) : window.innerHeight;
                const offsetTopPx = vv &amp;&amp; vv.offsetTop ? Math.round(vv.offsetTop) : 0;
                document.documentElement.style.setProperty('--visual-viewport-height', `${heightPx}px`);
                document.documentElement.style.setProperty('--visual-viewport-offset-top', `${offsetTopPx}px`);

                document.querySelectorAll('[role=&quot;dialog&quot;]:not(.hidden)').forEach((dialog) =&gt; {
                    dialog.style.height = `${heightPx}px`;
                    dialog.style.maxHeight = `${heightPx}px`;
                    dialog.style.top = `${offsetTopPx}px`;
                });
            };

            syncViewportHeight();

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', syncViewportHeight);
                window.visualViewport.addEventListener('scroll', syncViewportHeight);
            }
            window.addEventListener('resize', syncViewportHeight);

            const resetAllPopupOffsets = () =&gt; {
                document.querySelectorAll('[role=&quot;dialog&quot;] &gt; .fixed.inset-0.z-10 &gt; div &gt; div').forEach((card) =&gt; {
                    card.dataset.dragX = '0';
                    card.dataset.dragY = '0';
                    card.style.transform = '';
                });
            };

            const attachPopupDragSupport = () =&gt; {
                document.querySelectorAll('[role=&quot;dialog&quot;]').forEach((dialog) =&gt; {
                    const card = dialog.querySelector(':scope &gt; .fixed.inset-0.z-10 &gt; div &gt; div');
                    if (!card) return;

                    const handle = card.querySelector('[data-popup-drag-handle]') || card.firstElementChild;
                    if (!handle || handle.dataset.dragBound === '1') return;
                    handle.dataset.dragBound = '1';

                    let isDragging = false;
                    let startX = 0;
                    let startY = 0;
                    let originX = 0;
                    let originY = 0;

                    const getPoint = (ev) =&gt; {
                        if (ev.touches &amp;&amp; ev.touches.length &gt; 0) {
                            return { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
                        }
                        if (ev.changedTouches &amp;&amp; ev.changedTouches.length &gt; 0) {
                            return { x: ev.changedTouches[0].clientX, y: ev.changedTouches[0].clientY };
                        }
                        return { x: ev.clientX, y: ev.clientY };
                    };

                    const onStart = (ev) =&gt; {
                        if (ev.target &amp;&amp; ev.target.closest('button, input, textarea, select, label, a')) return;
                        const pt = getPoint(ev);
                        if (!Number.isFinite(pt.x) || !Number.isFinite(pt.y)) return;

                        isDragging = true;
                        startX = pt.x;
                        startY = pt.y;
                        originX = parseFloat(card.dataset.dragX || '0') || 0;
                        originY = parseFloat(card.dataset.dragY || '0') || 0;

                        if (ev.type === 'mousedown') {
                            ev.preventDefault();
                        }
                    };

                    const onMove = (ev) =&gt; {
                        if (!isDragging) return;
                        const pt = getPoint(ev);
                        if (!Number.isFinite(pt.x) || !Number.isFinite(pt.y)) return;

                        const vvHeight = (window.visualViewport &amp;&amp; window.visualViewport.height)
                            ? window.visualViewport.height
                            : window.innerHeight;
                        const maxOffsetY = Math.max(120, vvHeight * 0.75);
                        const maxOffsetX = Math.max(120, window.innerWidth * 0.65);

                        const rawX = originX + (pt.x - startX);
                        const rawY = originY + (pt.y - startY);
                        const nextX = Math.max(-maxOffsetX, Math.min(maxOffsetX, rawX));
                        const nextY = Math.max(-maxOffsetY, Math.min(maxOffsetY, rawY));

                        card.dataset.dragX = String(nextX);
                        card.dataset.dragY = String(nextY);
                        card.style.transform = `translate3d(${nextX}px, ${nextY}px, 0)`;

                        if (ev.cancelable) ev.preventDefault();
                    };

                    const onEnd = () =&gt; {
                        isDragging = false;
                    };

                    handle.addEventListener('mousedown', onStart);
                    handle.addEventListener('touchstart', onStart, { passive: true });
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('touchmove', onMove, { passive: false });
                    window.addEventListener('mouseup', onEnd);
                    window.addEventListener('touchend', onEnd);
                    window.addEventListener('touchcancel', onEnd);
                });
            };

            attachPopupDragSupport();

            const observer = new MutationObserver(() =&gt; {
                syncViewportHeight();
                attachPopupDragSupport();
                document.querySelectorAll('[role=&quot;dialog&quot;]').forEach((dialog) =&gt; {
                    if (dialog.classList.contains('hidden')) {
                        const card = dialog.querySelector(':scope &gt; .fixed.inset-0.z-10 &gt; div &gt; div');
                        if (card) {
                            card.dataset.dragX = '0';
                            card.dataset.dragY = '0';
                            card.style.transform = '';
                        }
                    }
                });
            });

            document.querySelectorAll('[role=&quot;dialog&quot;]').forEach((dialog) =&gt; {
                observer.observe(dialog, { attributes: true, attributeFilter: ['class'] });
            });

            window.__resetAllPopupOffsets = resetAllPopupOffsets;

            document.addEventListener('focusin', (event) =&gt; {
                const target = event.target;
                if (!target || !target.matches || !target.matches('input, textarea, select')) return;

                syncViewportHeight();
                setTimeout(() =&gt; {
                    try {
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } catch (e) {
                        target.scrollIntoView(false);
                    }
                }, 180);
            });
        }

        async function initApp() {
            setupViewportKeyboardHandler();
            const logoEl = document.getElementById('warehouse-logo-img');
            if (logoEl) logoEl.src = createWarehouseLogoSvg();

            try {
                const savedProducts = localStorage.getItem(STORAGE_KEY_PRODUCTS);
                const savedRequests = localStorage.getItem(STORAGE_KEY_REQUESTS);
                const savedUsers = localStorage.getItem(STORAGE_KEY_USERS);
                const savedOpname = localStorage.getItem(STORAGE_KEY_OPNAME);

                products = savedProducts ? JSON.parse(savedProducts) : [...SAMPLE_PRODUCTS];
                requests = savedRequests ? JSON.parse(savedRequests) : [...SAMPLE_REQUESTS];
                usersList = savedUsers ? JSON.parse(savedUsers) : [...SAMPLE_USERS];
                opnameRecords = (savedOpname &amp;&amp; typeof JSON.parse(savedOpname) === 'object' &amp;&amp; !Array.isArray(JSON.parse(savedOpname)))
                    ? JSON.parse(savedOpname)
                    : {};

                if (!Array.isArray(products) || products.length === 0) products = [...SAMPLE_PRODUCTS];
                if (!Array.isArray(requests)) requests = [...SAMPLE_REQUESTS];
                if (!Array.isArray(usersList)) usersList = [];

                if (!savedProducts) saveProducts();
                if (!savedRequests) saveRequests();
                if (!savedOpname) saveOpnameToStorage();
            } catch (e) {
                products = [...SAMPLE_PRODUCTS];
                requests = [...SAMPLE_REQUESTS];
                usersList = [];
                opnameRecords = {};
            }

            try {
                const remembered = localStorage.getItem(STORAGE_KEY_REMEMBER);
                if (remembered) {
                    const parsed = JSON.parse(remembered);
                    if (parsed &amp;&amp; parsed.username) {
                        const uInput = document.getElementById('login-username');
                        const remCheckbox = document.getElementById('login-remember');
                        if (uInput) uInput.value = parsed.username;
                        if (remCheckbox) remCheckbox.checked = true;
                    }
                }
            } catch (e) {
                console.error(e);
            }

            const searchInputEl = document.getElementById('search-input');
            const filterRackEl = document.getElementById('filter-rack');

            if (searchInputEl) {
                searchInputEl.addEventListener('input', () =&gt; {
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = setTimeout(() =&gt; {
                        catalogCurrentPage = 1;
                        renderCatalogTable();
                    }, 120);
                });
            }
            if (filterRackEl) {
                filterRackEl.addEventListener('change', () =&gt; {
                    catalogCurrentPage = 1;
                    renderCatalogTable();
                });
            }

            document.addEventListener('keydown', (e) =&gt; {
                const appShell = document.getElementById('app-shell');
                if (!appShell || appShell.classList.contains('hidden')) return;

                if (e.ctrlKey &amp;&amp; !e.shiftKey &amp;&amp; !e.altKey) {
                    if (e.key === '1') { e.preventDefault(); switchView('requests', 'Pending'); }
                    if (e.key === '2') { e.preventDefault(); if (isCurrentUserAdmin()) { switchView('opname'); } else { showToast('Menu Stok Opname khusus role admin', 'error'); } }
                    if (e.key === '3') { e.preventDefault(); switchView('catalog'); }
                    if (e.key === '4') { e.preventDefault(); openMessageModal(); }
                    if (e.key === '5') { e.preventDefault(); if (isCurrentUserAdmin()) { openProductModal(); } else { showToast('Menu Tambah Produk khusus role admin', 'error'); } }
                }
            });

            refreshAllUI();
            await syncUsersFromSpreadsheet();

            const activeSessionRaw = sessionStorage.getItem(STORAGE_KEY_SESSION);
            if (activeSessionRaw) {
                let parsedSession = null;
                try {
                    parsedSession = JSON.parse(activeSessionRaw);
                } catch (e) {
                    parsedSession = { username: activeSessionRaw };
                }

                const matchedUser = usersList.find(
                    (u) =&gt; u.Username.toLowerCase() === String(parsedSession?.username || '').toLowerCase()
                );

                const expiryDate = parseDateFlexible(parsedSession?.sessionExpiry || matchedUser?.SessionExpiry);
                const isExpired = expiryDate ? expiryDate.getTime() &lt; Date.now() : false;

                if (matchedUser &amp;&amp; matchedUser.Status === 'active' &amp;&amp; !isExpired) {
                    currentUser = { ...matchedUser };
                    enterMainApp(currentUser, false);
                } else {
                    sessionStorage.removeItem(STORAGE_KEY_SESSION);
                    showLoginScreen();
                }
            } else {
                showLoginScreen();
            }

            await syncProductsFromSpreadsheet(false);
            await syncRequestsFromSpreadsheet(false);
            await syncOpnameFromSpreadsheet(false);

            if (window.lucide) lucide.createIcons();
        }

        async function handleWarehouseLogin(event) {
            if (event) event.preventDefault();
            const usernameInput = document.getElementById('login-username');
            const passwordInput = document.getElementById('login-password');
            const rememberCheckbox = document.getElementById('login-remember');

            const identifier = (usernameInput ? usernameInput.value : '').trim();
            const password = (passwordInput ? passwordInput.value : '').trim();

            if (!identifier || !password) {
                setLoginLoadingState(false);
                showToast('Username/Email dan password wajib diisi', 'error');
                return;
            }

            setLoginLoadingState(true);

            try {
                await syncUsersFromSpreadsheet(false);

                if (!Array.isArray(usersList) || usersList.length === 0) {
                    setLoginLoadingState(false);
                    showToast(`Belum ada user terdaftar di sheet &quot;${USER_SHEET_NAME}&quot;. Hubungi admin.`, 'error');
                    return;
                }

                const lowerId = identifier.toLowerCase();
                const userRecord = usersList.find(
                    (u) =&gt;
                        String(u.Username || '').trim().toLowerCase() === lowerId ||
                        String(u.Email || '').trim().toLowerCase() === lowerId
                );

                if (!userRecord) {
                    setLoginLoadingState(false);
                    showToast(`User &quot;${identifier}&quot; tidak terdaftar di sheet &quot;${USER_SHEET_NAME}&quot;`, 'error');
                    return;
                }

                const accountStatus = String(userRecord.Status || 'active').trim().toLowerCase();
                if (accountStatus !== 'active') {
                    setLoginLoadingState(false);
                    showToast(`Akun &quot;${userRecord.Username}&quot; tidak aktif (status: ${userRecord.Status})`, 'error');
                    return;
                }

                const lockDate = parseDateFlexible(userRecord.LockUntil);
                if (lockDate &amp;&amp; lockDate.getTime() &gt; Date.now()) {
                    setLoginLoadingState(false);
                    showToast(`Akun terkunci hingga ${userRecord.LockUntil}`, 'error');
                    return;
                }

                const hashedInput = (await sha256Hex(password)).toLowerCase();
                const storedPass = String(userRecord.Password || '').trim();
                const storedPassLower = storedPass.toLowerCase();
                const demoPass = String(userRecord.DemoPassword || '').trim();

                const isValid =
                    (storedPass &amp;&amp; (password === storedPass || password.toLowerCase() === storedPassLower || hashedInput === storedPassLower)) ||
                    (demoPass &amp;&amp; password === demoPass);

                if (!isValid) {
                    userRecord.LoginAttempts = (Number(userRecord.LoginAttempts) || 0) + 1;
                    if (userRecord.LoginAttempts &gt;= 5) {
                        const unlockAt = new Date(Date.now() + 15 * 60 * 1000);
                        userRecord.LockUntil = unlockAt.toISOString();
                        userRecord.LoginAttempts = 0;
                        saveUsersToStorage();
                        setLoginLoadingState(false);
                        showToast('Terlalu banyak percobaan gagal. Akun dikunci selama 15 menit.', 'error');
                        return;
                    }
                    saveUsersToStorage();
                    setLoginLoadingState(false);
                    showToast(`Password salah untuk user &quot;${userRecord.Username}&quot;`, 'error');
                    return;
                }

                const sessionToken = userRecord.SessionToken || hashedInput.slice(0, 16) || `tok_${Date.now()}`;
                const sessionExpiry = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();

                userRecord.LoginAttempts = 0;
                userRecord.LockUntil = '';
                userRecord.SessionToken = sessionToken;
                userRecord.SessionExpiry = sessionExpiry;
                saveUsersToStorage();

                sessionStorage.setItem(STORAGE_KEY_SESSION, JSON.stringify({
                    username: userRecord.Username,
                    role: userRecord.Role,
                    sessionToken: sessionToken,
                    sessionExpiry: sessionExpiry
                }));

                if (rememberCheckbox &amp;&amp; rememberCheckbox.checked) {
                    localStorage.setItem(STORAGE_KEY_REMEMBER, JSON.stringify({ username: userRecord.Username }));
                } else {
                    localStorage.removeItem(STORAGE_KEY_REMEMBER);
                }

                enterMainApp(userRecord, true);
            } catch (err) {
                setLoginLoadingState(false);
                showToast('Terjadi kesalahan saat memverifikasi login', 'error');
            }
        }

        async function handleRegisterSubmit(event) {
            if (event) event.preventDefault();

            const fullName = (document.getElementById('reg-fullname')?.value || '').trim();
            const username = (document.getElementById('reg-username')?.value || '').trim();
            const email = (document.getElementById('reg-email')?.value || '').trim();
            const role = 'user';
            const password = (document.getElementById('reg-password')?.value || '').trim();
            const passwordConfirm = (document.getElementById('reg-password-confirm')?.value || '').trim();

            if (!fullName || !username || !email || !password) {
                showToast('Semua field pendaftaran wajib diisi', 'error');
                return;
            }

            if (password !== passwordConfirm) {
                showToast('Konfirmasi password tidak cocok', 'error');
                return;
            }

            if (!Array.isArray(usersList)) {
                usersList = [...SAMPLE_USERS];
            }

            const exists = usersList.some(
                (u) =&gt;
                    String(u.Username || '').trim().toLowerCase() === username.toLowerCase() ||
                    String(u.Email || '').trim().toLowerCase() === email.toLowerCase()
            );

            if (exists) {
                showToast('Username atau email sudah terdaftar', 'error');
                return;
            }

            const hashedPassword = await sha256Hex(password);
            const createdAt = getFormattedNow();
            const newUser = {
                Username: username,
                Password: hashedPassword,
                DemoPassword: password,
                Email: email,
                Role: role === 'admin' ? 'admin' : 'user',
                SessionToken: '',
                SessionExpiry: '',
                Status: 'active',
                LockUntil: '',
                LoginAttempts: 0,
                FullName: fullName,
                CreatedAt: createdAt
            };

            usersList.push(newUser);
            saveUsersToStorage();
            renderUsersTable();

            await pushUserToSpreadsheet({
                username,
                fullName,
                email,
                role: newUser.Role,
                status: 'active',
                password,
                createdAt: createdAt
            });

            const loginUserEl = document.getElementById('login-username');
            const loginPassEl = document.getElementById('login-password');
            if (loginUserEl) loginUserEl.value = username;
            if (loginPassEl) loginPassEl.value = password;

            closeRegisterModal();
            showToast(`Akun &quot;${username}&quot; terdaftar di sheet &quot;${USER_SHEET_NAME}&quot;. Silakan Login.`, 'success');
        }

        function handleLogoutClick() {
            openConfirmModal(

                'Apakah Anda yakin ingin keluar dari sesi Admin Panel?',
                () =&gt; {

        function getCurrentUserIdentityTokens() {
            if (!currentUser) return [];
            const tokens = [
                currentUser.Username,
                currentUser.FullName,
                currentUser.Email
            ]
                .map((v) =&gt; String(v || '').trim().toLowerCase())
                .filter(Boolean);
            return [...new Set(tokens)];
        }

        function doesRequestBelongToCurrentUser(req) {
            if (isCurrentUserAdmin()) return true;
            const tokens = getCurrentUserIdentityTokens();
            if (tokens.length === 0 || !req) return false;

            const directFields = [
                req.createdBy,
                req.username,
                req.user,
                req.picName,
                req.pic
            ]
                .map((v) =&gt; String(v || '').trim().toLowerCase())
                .filter(Boolean);

            if (directFields.some((val) =&gt; tokens.includes(val))) {
                return true;
            }

            const notesText = String(req.notes || '').toLowerCase();
            if (notesText) {
                const picMatch = notesText.match(/\bpic\s*:\s*([^•|\n]+)/i);
                if (picMatch) {
                    const extractedPic = picMatch[1].trim().toLowerCase();
                    if (tokens.some((tok) =&gt; extractedPic === tok || extractedPic.includes(`(${tok})`))) {
                        return true;
                    }
                }
            }

            return false;
        }

        function getRoleFilteredRequests() {
            if (isCurrentUserAdmin()) return requests;
            return requests.filter((r) =&gt; doesRequestBelongToCurrentUser(r));
        }

        function normalizeSheetKey(key) {
            return String(key || '')
                .toLowerCase()
                .replace(/[^a-z0-9]/g, '');
        }

        function parseCsvLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i &lt; line.length; i++) {
                const ch = line[i];
                if (inQuotes) {
                    if (ch === '&quot;' &amp;&amp; line[i + 1] === '&quot;') {
                        current += '&quot;';
                        i++;
                    } else if (ch === '&quot;') {
                        inQuotes = false;
                    } else {
                        current += ch;
                    }
                } else if (ch === '&quot;') {
                    inQuotes = true;
                } else if (ch === ',') {
                    result.push(current);
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current);
            return result;
        }

        function mapSheetRowToProduct(rawObj, index) {
            const normalized = {};
            Object.keys(rawObj || {}).forEach((k) =&gt; {
                normalized[normalizeSheetKey(k)] = rawObj[k];
            });

            const sku = String(
                normalized.sku ??
                normalized.kodebarang ??
                normalized.kodeproduk ??
                normalized.kode ??
                ''
            ).trim().toUpperCase();

            const name = String(
                normalized.name ??
                normalized.namabarang ??
                normalized.namaproduk ??
                normalized.nama ??
                normalized.item ??
                ''
            ).trim();

            if (!sku &amp;&amp; !name) return null;

            const category = String(
                normalized.category ??
                normalized.kategori ??
                'Lainnya'
            ).trim() || 'Lainnya';

            const rack = String(
                normalized.rack ??
                normalized.rak ??
                normalized.lokasirak ??
                normalized.lokasi ??
                '-'
            ).trim() || '-';

            const rawStock = Number(
                normalized.stock ??
                normalized.stok ??
                normalized.stokakhir ??
                normalized.qty ??
                0
            );
            const stock = Number.isFinite(rawStock) ? Math.max(0, rawStock) : 0;

            const rawMinStock = Number(
                normalized.minstock ??
                normalized.batasmin ??
                normalized.min ??
                5
            );
            const minStock = Number.isFinite(rawMinStock) &amp;&amp; rawMinStock &gt;= 0 ? rawMinStock : 5;

            const unit = String(
                normalized.unit ??
                normalized.satuan ??
                'PCS'
            ).trim() || 'PCS';

            const rawPrice = Number(
                normalized.price ??
                normalized.harga ??
                0
            );
            const price = Number.isFinite(rawPrice) ? Math.max(0, rawPrice) : 0;

            const notes = String(
                normalized.notes ??
                normalized.keterangan ??
                normalized.deskripsi ??
                'No Description'
            ).trim() || 'No Description';

            const rawImage = String(
                normalized.image ??
                normalized.gambar ??
                normalized.foto ??
                normalized.fotoproduk ??
                ''
            ).trim();

            const image = rawImage || createSvgPlaceholder('#eff6ff', '#2563eb', sku || name.slice(0, 8));
            const id = String(normalized.id || sku || `sheet_p_${index + 1}`).trim();

            return {
                id,
                sku: sku || `SKU-${index + 1}`,
                name: name || sku,
                category,
                rack,
                stock,
                minStock,
                unit,
                price,
                notes,
                image
            };
        }

        function mapSheetRowToRequest(rawObj, index) {
            const normalized = {};
            Object.keys(rawObj || {}).forEach((k) =&gt; {
                normalized[normalizeSheetKey(k)] = rawObj[k];
            });

            const id = String(
                normalized.idpermintaan ??
                normalized.id ??
                normalized.norequest ??
                ''
            ).trim();

            const productName = String(
                normalized.namabarang ??
                normalized.productname ??
                normalized.barang ??
                ''
            ).trim();

            if (!id &amp;&amp; !productName) return null;

            const qty = Math.max(1, Number(normalized.jumlah ?? normalized.qty ?? 1) || 1);
            const rawApproved = normalized.qtyapprove ?? normalized.approvedqty;
            const approvedQty = rawApproved !== undefined &amp;&amp; rawApproved !== ''
                ? Math.max(0, Number(rawApproved) || 0)
                : qty;

            const rawStatus = String(normalized.status ?? 'Pending').trim().toLowerCase();
            const status = rawStatus === 'approved'
                ? 'Approved'
                : rawStatus === 'rejected'
                    ? 'Rejected'
                    : 'Pending';

            return {
                id: id || `REQ-${343 + index}`,
                date: String(normalized.tanggal ?? normalized.date ?? '').trim(),
                division: String(normalized.divisicabang ?? normalized.divisi ?? normalized.division ?? 'General Warehouse').trim() || 'General Warehouse',
                picName: String(normalized.pic ?? normalized.picname ?? '').trim(),
                createdBy: String(normalized.dibuatoleh ?? normalized.createdby ?? normalized.username ?? normalized.user ?? '').trim(),
                productId: String(normalized.productid ?? '').trim() || null,
                productName: productName || 'Barang',
                qty,
                approvedQty,
                notes: String(normalized.keterangan ?? normalized.notes ?? '').trim(),
                status
            };
        }

        async function syncRequestsFromSpreadsheet(notify = true) {
            if (!APPS_SCRIPT_WEB_APP_URL) return false;
            try {
                const sep = APPS_SCRIPT_WEB_APP_URL.includes('?') ? '&amp;' : '?';
                const res = await fetch(`${APPS_SCRIPT_WEB_APP_URL}${sep}action=getRequests&amp;sheet=${encodeURIComponent(REQUESTS_SHEET_NAME)}&amp;_=${Date.now()}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const payload = await res.json();
                const rows = Array.isArray(payload) ? payload : (payload.data || payload.rows || []);
                const mapped = rows
                    .map((row, idx) =&gt; mapSheetRowToRequest(row, idx))
                    .filter(Boolean)
                    .reverse();

                if (mapped.length &gt; 0) {
                    requests = mapped;
                    saveRequests();
                    refreshAllUI();
                    if (notify) {
                        showToast(`Daftar permintaan disinkronkan dari sheet &quot;${REQUESTS_SHEET_NAME}&quot; (${mapped.length} baris)`, 'success');
                    }
                    return true;
                }
                if (notify) {
                    showToast(`Sheet &quot;${REQUESTS_SHEET_NAME}&quot; masih kosong`, 'success');
                }
                return false;
            } catch (err) {
                console.warn('Gagal menyinkronkan sheet Permintaan:', err);
                if (notify) {
                    showToast('Gagal memuat sheet &quot;Permintaan&quot; (pastikan Code.gs terbaru sudah di-deploy ulang)', 'error');
                }
                return false;
            }
        }

        async function pushRequestsToSpreadsheet(newRequestItems) {
            const webAppUrl = getSharedWebAppUrl();
            if (!webAppUrl || !Array.isArray(newRequestItems) || newRequestItems.length === 0) return false;
            try {
                const actor = getCurrentOpnameActorName();
                const res = await fetch(webAppUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'saveRequests',
                        sheetId: SHEET_ID,
                        sheetName: REQUESTS_SHEET_NAME,
                        requests: newRequestItems.map((r) =&gt; ({
                            ...r,
                            updatedBy: actor,
                            updatedAt: getFormattedNow()
                        }))
                    })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const result = await res.json().catch(() =&gt; ({}));
                if (result.success === false) {
                    throw new Error(result.error || 'Gagal menulis ke sheet Permintaan');
                }
                return true;
            } catch (err) {
                console.warn('Gagal mengirim permintaan ke Google Sheet:', err);
                showToast('Permintaan tersimpan lokal, namun gagal sinkron ke sheet &quot;Permintaan&quot;', 'error');
                return false;
            }
        }

        async function fetchInventoryFromGoogleSheet() {
            const webAppUrl = getSharedWebAppUrl();
            if (webAppUrl) {
                const sep = webAppUrl.includes('?') ? '&amp;' : '?';
                const res = await fetch(`${webAppUrl}${sep}action=getInventory&amp;sheet=${encodeURIComponent(SHEET_NAME)}&amp;_=${Date.now()}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const payload = await res.json();
                const rows = Array.isArray(payload) ? payload : (payload.data || payload.rows || []);
                return rows
                    .map((row, idx) =&gt; mapSheetRowToProduct(row, idx))
                    .filter(Boolean);
            }
            return [];
        }

        async function syncProductsFromSpreadsheet(notify = true) {

                        const hasCustomLocalImage = existing &amp;&amp;

                            existing.image.startsWith('data:image/jpeg');

                    btnGrid.className = 'p-2 rounded-lg text-slate-500 hover:text-slate-800 transition';
                } else {
                    btnGrid.className = 'p-2 rounded-lg bg-white text-indigo-600 shadow-2xs transition';
                    btnList.className = 'p-2 rounded-lg text-slate-500 hover:text-slate-800 transition';
                }
            }
            renderCatalogTable();
        }

        function populateRackFilter() {
            const select = document.getElementById('filter-rack');
            if (!select) return;
            const prevVal = select.value || 'ALL';
            const racks = [...new Set(products.map((p) =&gt; (p.rack || '').trim()).filter((r) =&gt; r &amp;&amp; r !== '-'))].sort();

            select.innerHTML = `&lt;option value=&quot;ALL&quot;&gt;Semua Rak&lt;/option&gt;` + racks.map((r) =&gt;
                `&lt;option value=&quot;${escapeHtml(r)}&quot;&gt;${escapeHtml(r)}&lt;/option&gt;`
            ).join('');

            if ([...select.options].some((opt) =&gt; opt.value === prevVal)) {
                select.value = prevVal;
            } else {
                select.value = 'ALL';
            }
        }

        function renderCategoryPills() {
            const combo = document.getElementById('filter-category');
            if (!combo) return;

            const catCounts = new Map();
            products.forEach((p) =&gt; {
                const cat = (p.category || 'Lainnya').trim() || 'Lainnya';
                catCounts.set(cat, (catCounts.get(cat) || 0) + 1);
            });

            const categories = [...catCounts.keys()].sort((a, b) =&gt; a.localeCompare(b, 'id'));
            if (activeCategory !== 'ALL' &amp;&amp; !catCounts.has(activeCategory)) {
                activeCategory = 'ALL';
            }

            const options = [
                `&lt;option value=&quot;ALL&quot;&gt;Semua Kategori (${products.length})&lt;/option&gt;`,
                ...categories.map((cat) =&gt;
                    `&lt;option value=&quot;${escapeHtml(cat)}&quot;&gt;${escapeHtml(cat)} (${catCounts.get(cat)})&lt;/option&gt;`
                )
            ];

            combo.innerHTML = options.join('');
            combo.value = activeCategory;
        }

        function selectCategory(cat) {
            activeCategory = cat || 'ALL';
            catalogCurrentPage = 1;
            const combo = document.getElementById('filter-category');
            if (combo &amp;&amp; combo.value !== activeCategory) {
                combo.value = activeCategory;
            }
            renderCatalogTable();
        }

        function getFilteredProducts() {
            const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
            const rack = document.getElementById('filter-rack')?.value || 'ALL';

            return products.filter((p) =&gt; {
                if (activeCategory !== 'ALL' &amp;&amp; (p.category || 'Lainnya') !== activeCategory) return false;
                if (rack !== 'ALL' &amp;&amp; (p.rack || '') !== rack) return false;

                if (q) {
                    const haystack = `${p.sku || ''} ${p.name || ''} ${p.category || ''} ${p.rack || ''} ${p.notes || ''}`.toLowerCase();
                    if (!haystack.includes(q)) return false;
                }
                return true;
            });
        }

        function changeCatalogPageSize(newSize) {
            const parsed = parseInt(newSize, 10);
            catalogPageSize = Number.isFinite(parsed) &amp;&amp; parsed &gt; 0 ? parsed : CATALOG_BATCH_SIZE;
            catalogCurrentPage = 1;
            renderCatalogTable();
        }

        function goToCatalogPage(pageNum) {
            const filtered = getFilteredProducts();
            const totalPages = Math.max(1, Math.ceil(filtered.length / catalogPageSize));
            const target = Math.min(Math.max(1, parseInt(pageNum, 10) || 1), totalPages);
            catalogCurrentPage = target;
            renderCatalogTable();
            const catalogSection = document.getElementById('view-catalog');
            if (catalogSection) {
                catalogSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderCatalogTable() {
            const container = document.getElementById('catalog-cards-container');
            const emptyEl = document.getElementById('catalog-empty-state');
            const countLabel = document.getElementById('catalog-count-label');
            const paginationBar = document.getElementById('catalog-pagination-bar');
            const pageInfoEl = document.getElementById('catalog-page-info');
            const pageControlsEl = document.getElementById('catalog-page-controls');
            const pageSizeSelect = document.getElementById('catalog-page-size');
            if (!container) return;

            if (pageSizeSelect &amp;&amp; Number(pageSizeSelect.value) !== catalogPageSize) {
                pageSizeSelect.value = String(catalogPageSize);
            }

            const filtered = getFilteredProducts();
            if (countLabel) countLabel.textContent = `(${filtered.length} item)`;

            container.className = catalogViewMode === 'grid'
                ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4'
                : 'space-y-3.5';

            if (filtered.length === 0) {
                container.innerHTML = '';
                if (emptyEl) emptyEl.classList.remove('hidden');
                if (paginationBar) paginationBar.classList.add('hidden');
                return;
            }
            if (emptyEl) emptyEl.classList.add('hidden');

            const totalItems = filtered.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / catalogPageSize));
            if (catalogCurrentPage &gt; totalPages) catalogCurrentPage = totalPages;
            if (catalogCurrentPage &lt; 1) catalogCurrentPage = 1;

            const startIdx = (catalogCurrentPage - 1) * catalogPageSize;
            const endIdx = Math.min(startIdx + catalogPageSize, totalItems);
            const visibleItems = filtered.slice(startIdx, endIdx);

            container.innerHTML = visibleItems.map((p) =&gt; {
                const stock = Number(p.stock) || 0;
                const minStock = Number(p.minStock ?? 5);
                const stockBadgeClass = stock === 0
                    ? 'bg-rose-100 text-rose-700 border-rose-200'
                    : stock &lt;= minStock
                        ? 'bg-amber-100 text-amber-800 border-amber-200'
                        : 'bg-emerald-100 text-emerald-700 border-emerald-200';

                const imgSrc = p.image || createSvgPlaceholder('#eff6ff', '#2563eb', p.sku);

                return `
                    &lt;div class=&quot;bg-white hover:border-indigo-300 border border-slate-200/90 rounded-2xl p-4 shadow-2xs hover:shadow-sm transition flex ${catalogViewMode === 'grid' ? 'flex-col justify-between gap-4' : 'flex-col sm:flex-row sm:items-center justify-between gap-4'}&quot;&gt;
                        &lt;div class=&quot;flex items-start sm:items-center gap-3.5 min-w-0&quot;&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;openImageLightbox('${escapeAttr(p.id)}')&quot;
                                class=&quot;w-16 h-16 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center justify-center overflow-hidden shrink-0 hover:ring-2 hover:ring-indigo-400 transition&quot;&gt;
                                &lt;img src=&quot;${escapeAttr(imgSrc)}&quot; alt=&quot;${escapeHtml(p.name)}&quot; loading=&quot;lazy&quot; class=&quot;w-full h-full object-contain&quot;&gt;
                            &lt;/button&gt;

                            &lt;div class=&quot;min-w-0 space-y-1&quot;&gt;
                                &lt;div class=&quot;text-[11px] font-bold tracking-wider uppercase text-slate-400&quot;&gt;${escapeHtml(p.sku)}&lt;/div&gt;
                                &lt;button type=&quot;button&quot; onclick=&quot;openImageLightbox('${escapeAttr(p.id)}')&quot;
                                    class=&quot;text-left text-sm sm:text-base font-extrabold text-slate-900 hover:text-indigo-600 transition line-clamp-1&quot;&gt;
                                    ${escapeHtml(p.name)}
                                &lt;/button&gt;
                                &lt;div class=&quot;flex flex-wrap items-center gap-2 pt-0.5&quot;&gt;
                                    &lt;span class=&quot;px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold border ${stockBadgeClass}&quot;&gt;
                                        Stok: ${stock}
                                    &lt;/span&gt;
                                    &lt;span class=&quot;px-2.5 py-0.5 rounded-lg text-[11px] font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100&quot;&gt;
                                        📍 Rak: ${escapeHtml(p.rack || '-')}
                                    &lt;/span&gt;
                                &lt;/div&gt;
                                &lt;div class=&quot;text-xs text-slate-500 truncate&quot;&gt;
                                    ${escapeHtml(p.category || 'Lainnya')} • ${escapeHtml(p.notes || 'No Description')}
                                &lt;/div&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;

                        &lt;div class=&quot;flex items-center justify-end gap-2 shrink-0&quot;&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;addToCart('${escapeAttr(p.id)}')&quot;
                                class=&quot;px-3.5 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-600 text-indigo-700 hover:text-white text-xs font-bold inline-flex items-center gap-1.5 transition cursor-pointer&quot;&gt;
                                &lt;i data-lucide=&quot;shopping-cart&quot; class=&quot;w-3.5 h-3.5&quot;&gt;&lt;/i&gt;
                                &lt;span&gt;+ Keranjang&lt;/span&gt;
                            &lt;/button&gt;
                            ${isCurrentUserAdmin() ? `
                                &lt;button type=&quot;button&quot; onclick=&quot;openProductModal('${escapeAttr(p.id)}')&quot; title=&quot;Edit Produk&quot;
                                    class=&quot;p-2 rounded-xl text-slate-400 hover:text-indigo-600 hover:bg-slate-100 transition cursor-pointer&quot;&gt;
                                    &lt;i data-lucide=&quot;pencil&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                                &lt;/button&gt;
                            ` : ''}
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
            }).join('');

            if (paginationBar) {
                if (totalItems &gt; catalogPageSize) {
                    paginationBar.classList.remove('hidden');
                    if (pageInfoEl) {
                        pageInfoEl.textContent = `Menampilkan ${startIdx + 1}-${endIdx} dari ${totalItems} item`;
                    }
                    if (pageControlsEl) {
                        const pageButtons = [];
                        const maxVisiblePages = 5;
                        let startPage = Math.max(1, catalogCurrentPage - Math.floor(maxVisiblePages / 2));
                        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
                        if (endPage - startPage + 1 &lt; maxVisiblePages) {
                            startPage = Math.max(1, endPage - maxVisiblePages + 1);
                        }

                        if (startPage &gt; 1) {
                            pageButtons.push(`&lt;button type=&quot;button&quot; onclick=&quot;goToCatalogPage(1)&quot; class=&quot;w-8 h-8 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700 cursor-pointer&quot;&gt;1&lt;/button&gt;`);
                            if (startPage &gt; 2) pageButtons.push(`&lt;span class=&quot;px-1 text-xs text-slate-400&quot;&gt;...&lt;/span&gt;`);
                        }

                        for (let page = startPage; page &lt;= endPage; page++) {
                            const isCurrent = page === catalogCurrentPage;
                            const btnCls = isCurrent
                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-2xs'
                                : 'bg-white hover:bg-slate-100 text-slate-700 border-slate-200';
                            pageButtons.push(`&lt;button type=&quot;button&quot; onclick=&quot;goToCatalogPage(${page})&quot; class=&quot;w-8 h-8 rounded-lg border text-xs font-bold transition cursor-pointer ${btnCls}&quot;&gt;${page}&lt;/button&gt;`);
                        }

                        if (endPage &lt; totalPages) {
                            if (endPage &lt; totalPages - 1) pageButtons.push(`&lt;span class=&quot;px-1 text-xs text-slate-400&quot;&gt;...&lt;/span&gt;`);
                            pageButtons.push(`&lt;button type=&quot;button&quot; onclick=&quot;goToCatalogPage(${totalPages})&quot; class=&quot;w-8 h-8 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700 cursor-pointer&quot;&gt;${totalPages}&lt;/button&gt;`);
                        }

                        pageControlsEl.innerHTML = `
                            &lt;button type=&quot;button&quot; onclick=&quot;goToCatalogPage(${catalogCurrentPage - 1})&quot; ${catalogCurrentPage &lt;= 1 ? 'disabled' : ''}
                                class=&quot;px-2.5 h-8 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-700 disabled:opacity-40 cursor-pointer&quot;&gt;Prev&lt;/button&gt;
                            ${pageButtons.join('')}
                            &lt;button type=&quot;button&quot; onclick=&quot;goToCatalogPage(${catalogCurrentPage + 1})&quot; ${catalogCurrentPage &gt;= totalPages ? 'disabled' : ''}
                                class=&quot;px-2.5 h-8 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-700 disabled:opacity-40 cursor-pointer&quot;&gt;Next&lt;/button&gt;
                        `;
                    }
                } else {
                    paginationBar.classList.add('hidden');
                }
            }

            if (window.lucide) lucide.createIcons();
        }

        function compressImageFile(file, maxSize = 480, quality = 0.72) {
            return new Promise((resolve, reject) =&gt; {
                const reader = new FileReader();
                reader.onload = (ev) =&gt; {
                    const img = new Image();
                    img.onload = () =&gt; {
                        let { width, height } = img;
                        if (width &gt; height &amp;&amp; width &gt; maxSize) {
                            height = Math.round((height * maxSize) / width);
                            width = maxSize;
                        } else if (height &gt;= width &amp;&amp; height &gt; maxSize) {
                            width = Math.round((width * maxSize) / height);
                            height = maxSize;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = ev.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handleImageUpload(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            try {
                const compressed = await compressImageFile(file);
                document.getElementById('product-image-data').value = compressed;
                updateImagePreview(compressed);
                showToast('Foto produk siap disimpan', 'success');
            } catch (e) {
                showToast('Gagal memproses gambar', 'error');
            }
        }

        async function handleProductSubmit(event) {
            event.preventDefault();
            if (!isCurrentUserAdmin()) {
                showToast('Aksi ini hanya untuk role admin', 'error');
                return;
            }
            const idVal = document.getElementById('product-id').value.trim();
            const sku = document.getElementById('product-sku').value.trim().toUpperCase();
            const rack = document.getElementById('product-rack').value.trim() || '-';
            const name = document.getElementById('product-name').value.trim();
            const category = document.getElementById('product-category').value.trim() || 'Lainnya';
            const unit = document.getElementById('product-unit').value || 'PCS';
            const notes = document.getElementById('product-notes').value.trim() || 'No Description';
            const uploadedImage = document.getElementById('product-image-data').value.trim();

            if (!sku || !name) {
                showToast('Kode/SKU dan Nama Barang wajib diisi', 'error');
                return;
            }

            if (idVal) {
                const idx = products.findIndex((p) =&gt; p.id === idVal);
                if (idx !== -1) {
                    products[idx] = {
                        ...products[idx],
                        sku,
                        rack,
                        name,
                        category,
                        unit,
                        notes,
                        image: uploadedImage || products[idx].image || createSvgPlaceholder('#eff6ff', '#2563eb', sku)
                    };
                    showToast(`Produk ${sku} berhasil diperbarui`, 'success');
                }
            } else {
                const newProduct = {
                    id: `prod_${Date.now()}`,
                    sku,
                    rack,
                    name,
                    category,
                    unit,
                    stock: 0,
                    minStock: 5,
                    price: 0,
                    notes,
                    image: uploadedImage || createSvgPlaceholder('#eff6ff', '#2563eb', sku)
                };
                products.unshift(newProduct);
                showToast(`Produk ${sku} berhasil ditambahkan`, 'success');
            }

            saveProducts();
            closeProductModal();
            refreshAllUI();
        }

            } catch (e) {}
            requestAnimationFrame(() =&gt; {

        async function saveDetailRackFromLightbox() {
            if (!isCurrentUserAdmin()) {
                showToast('Lokasi rak hanya dapat diubah oleh role admin', 'error');
                return;
            }
            if (!currentLightboxProductId) return;
            const prod = products.find((p) =&gt; p.id === currentLightboxProductId);
            const rackInputEl = document.getElementById('detail-rack');
            if (!prod || !rackInputEl) return;

            const newRack = rackInputEl.value.trim() || '-';
            if ((prod.rack || '-') === newRack) return;

            prod.rack = newRack;
            saveProducts();
            populateRackFilter();
            renderCatalogTable();
            renderOpnameTable();

            const webAppUrl = getSharedWebAppUrl();
            let synced = false;
            if (webAppUrl &amp;&amp; prod.sku) {
                try {
                    const res = await fetch(webAppUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'updateProductRack',
                            sheetId: SHEET_ID,
                            sheetName: SHEET_NAME,
                            sku: prod.sku,
                            rack: newRack,
                            updatedBy: getCurrentOpnameActorName(),
                            updatedAt: getFormattedNow()
                        })
                    });
                    if (res.ok) {
                        const result = await res.json().catch(() =&gt; ({}));
                        synced = result.success !== false &amp;&amp; result.sheetUpdated !== false;
                    }
                } catch (err) {
                    console.warn('Gagal menyinkronkan rak ke Google Sheet:', err);
                }
            }

            showToast(
                synced
                    ? `Lokasi rak ${prod.sku} diperbarui ke &quot;${newRack}&quot; &amp; tersinkron ke sheet &quot;${SHEET_NAME}&quot;`
                    : `Lokasi rak ${prod.sku} diperbarui ke &quot;${newRack}&quot;`,
                'success'
            );
        }

        async function startDetailCameraUpload() {

            const videoEl = document.getElementById('detail-camera-video');
            const cameraBox = document.getElementById('detail-camera-box');
            const imgEl = document.getElementById('detail-img');

        async function saveCompressedDetailImage(dataUrl) {
            if (!currentLightboxProductId || !dataUrl) return;
            const idx = products.findIndex((p) =&gt; p.id === currentLightboxProductId);
            if (idx === -1) return;

            const prod = products[idx];
            prod.image = dataUrl;
            saveProducts();

            const detailImg = document.getElementById('detail-img');
            if (detailImg) detailImg.src = dataUrl;
            renderCatalogTable();
            renderOpnameTable();

            const uploadResult = await uploadImageToSharedStorage(prod, dataUrl);
            if (uploadResult.shared &amp;&amp; uploadResult.imageUrl) {
                products[idx].image = uploadResult.imageUrl;
                saveProducts();
                if (detailImg) detailImg.src = uploadResult.imageUrl;
                renderCatalogTable();
                renderOpnameTable();
                showToast(`Foto ${prod.sku} tersimpan di penyimpanan bersama &amp; terlihat oleh semua user`, 'success');
            } else {
                showToast(`Foto ${prod.sku} tersimpan di perangkat ini (atur Penyimpanan Bersama agar terlihat user lain)`, 'success');
            }
        }

        function captureDetailCameraPhoto() {
            const videoEl = document.getElementById('detail-camera-video');
            if (!videoEl || !videoEl.videoWidth || !videoEl.videoHeight) {
                showToast('Kamera belum siap, silakan coba lagi', 'error');
                return;
            }

            const maxSize = 480;
            let width = videoEl.videoWidth;
            let height = videoEl.videoHeight;
            if (width &gt; height &amp;&amp; width &gt; maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
            } else if (height &gt;= width &amp;&amp; height &gt; maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', 0.78);

            stopDetailCamera(true);
            saveCompressedDetailImage(compressed);
        }

        function getCurrentOpnameActorName() {
            if (currentUser) {
                const fullName = String(currentUser.FullName || '').trim();
                const username = String(currentUser.Username || '').trim();
                if (fullName &amp;&amp; username &amp;&amp; fullName.toLowerCase() !== username.toLowerCase()) {
                    return `${fullName} (${username})`;
                }
                return fullName || username || 'Administrator';
            }

            try {
                const rawSession = sessionStorage.getItem(STORAGE_KEY_SESSION);
                if (rawSession) {
                    const parsed = JSON.parse(rawSession);
                    if (parsed?.username) return String(parsed.username).trim();
                    return String(rawSession).trim();
                }
            } catch (e) {
                console.error(e);
            }

            return 'Administrator';

        function exportOpnameToCSV() {
            const filteredProducts = getFilteredOpnameProducts();
            if (filteredProducts.length === 0) {
                showToast('Tidak ada data stok opname untuk di-export', 'error');
                return;
            }

            const headers = ['SKU', 'Nama Barang', 'Rak', 'Satuan', 'Stok Sistem', 'Stok Fisik', 'Selisih', 'Diupdate Oleh', 'Waktu Update'];
            const rows = filteredProducts.map((p) =&gt; {
                const sysStock = Number(p.stock) || 0;
                const rec = opnameRecords[p.id];
                const hasSavedOpname = rec !== undefined &amp;&amp; rec !== null;
                const physStock = hasSavedOpname ? Math.max(0, Number(rec.physicalStock) || 0) : 0;
                const diff = hasSavedOpname ? (physStock - sysStock) : (0 - sysStock);
                const updatedBy = rec?.updatedBy || '-';
                const updatedAt = rec?.updatedAt || '-';

                return [
                    p.sku || '',
                    p.name || '',
                    p.rack || '-',
                    p.unit || 'PCS',
                    sysStock,
                    physStock,
                    diff,
                    updatedBy,
                    updatedAt
                ];
            });

            const csvContent = [headers, ...rows]
                .map((row) =&gt; row.map((cell) =&gt; `&quot;${String(cell ?? '').replace(/&quot;/g, '&quot;&quot;')}&quot;`).join(','))
                .join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `stok_opname_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`File CSV stok opname (${filteredProducts.length} produk) berhasil di-export`, 'success');
        }

        function formatDiffDisplay(diff) {
            const num = Number(diff) || 0;
            if (num &gt; 0) return `+${num}`;
            return String(num);
