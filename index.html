        function getDiffClassName(diff) {
            const num = Number(diff) || 0;
            if (num &gt; 0) return 'text-emerald-600';
            if (num &lt; 0) return 'text-rose-600';
            return 'text-slate-500';
        }

        function mapSheetRowToOpname(rawObj) {
            const normalized = {};
            Object.keys(rawObj || {}).forEach((k) =&gt; {
                normalized[normalizeSheetKey(k)] = rawObj[k];
            });

            const sku = String(
                normalized.sku ??
                normalized.kodebarang ??
                normalized.kode ??
                ''
            ).trim().toUpperCase();

            const productName = String(
                normalized.namabarang ??
                normalized.name ??
                normalized.barang ??
                ''
            ).trim();

            if (!sku &amp;&amp; !productName) return null;

            const sysStock = Number(normalized.stoksystem ?? normalized.systemstock ?? 0) || 0;
            const physStock = Math.max(0, Number(normalized.stokfisik ?? normalized.physicalstock ?? 0) || 0);
            const rawDiff = Number(normalized.selisih ?? normalized.diff);
            const diff = Number.isFinite(rawDiff) ? rawDiff : (physStock - sysStock);
            const updatedBy = String(normalized.diupdateoleh ?? normalized.updatedby ?? 'Administrator').trim();
            const rawUpdatedAt = normalized.waktuso ?? normalized.waktuupdate ?? normalized.updatedat ?? '';
            const updatedAt = formatDisplayDateTime(rawUpdatedAt);

            return {
                sku,
                productName,
                physicalStock: physStock,
                diff,
                updatedBy,
                updatedAt
            };
        }

        async function syncOpnameFromSpreadsheet(notify = false) {
            const webAppUrl = getSharedWebAppUrl();
            if (!webAppUrl) return false;

            try {
                const sep = webAppUrl.includes('?') ? '&amp;' : '?';
                const res = await fetch(`${webAppUrl}${sep}action=getOpname&amp;sheet=${encodeURIComponent(OPNAME_SHEET_NAME)}&amp;_=${Date.now()}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const payload = await res.json();
                const rows = Array.isArray(payload) ? payload : (payload.data || payload.rows || []);
                const mapped = rows.map((row) =&gt; mapSheetRowToOpname(row)).filter(Boolean);

                if (mapped.length &gt; 0) {
                    const productBySku = new Map();
                    products.forEach((p) =&gt; {
                        if (p.sku) productBySku.set(String(p.sku).trim().toUpperCase(), p);
                    });

                    mapped.forEach((item) =&gt; {
                        const matchedProd = item.sku
                            ? productBySku.get(item.sku)
                            : products.find((p) =&gt; String(p.name || '').trim().toLowerCase() === item.productName.toLowerCase());

                        if (matchedProd) {
                            const sysStock = Number(matchedProd.stock) || 0;
                            opnameRecords[matchedProd.id] = {
                                physicalStock: item.physicalStock,
                                diff: item.physicalStock - sysStock,
                                updatedBy: item.updatedBy,
                                updatedAt: item.updatedAt
                            };
                        }
                    });

                    saveOpnameToStorage();
                    renderOpnameTable();
                    if (notify) {
                        showToast(`Data stok opname dimuat dari sheet &quot;${OPNAME_SHEET_NAME}&quot; (${mapped.length} item)`, 'success');
                    }
                    return true;
                }

                if (notify) {
                    showToast(`Sheet &quot;${OPNAME_SHEET_NAME}&quot; masih kosong`, 'success');
                }
                return false;
            } catch (err) {
                console.warn('Gagal memuat sheet Stok Opname:', err);
                if (notify) {
                    showToast('Gagal memuat sheet &quot;Stok Opname&quot; (pastikan Code.gs terbaru sudah di-deploy ulang)', 'error');
                }
                return false;
            }
        }

        async function pushOpnameRecordToSpreadsheet(prod, opnameRec) {
            const webAppUrl = getSharedWebAppUrl();
            if (!webAppUrl || !prod || !opnameRec) return false;

            try {
                const sysStock = Number(prod.stock) || 0;
                const physStock = Math.max(0, Number(opnameRec.physicalStock) || 0);
                const diff = physStock - sysStock;

                const res = await fetch(webAppUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'saveOpname',
                        sheetId: SHEET_ID,
                        sheetName: OPNAME_SHEET_NAME,
                        records: [{
                            productId: prod.id || '',
                            sku: prod.sku || '',
                            productName: prod.name || '',
                            rack: prod.rack || '-',
                            unit: prod.unit || 'PCS',
                            systemStock: sysStock,
                            physicalStock: physStock,
                            diff: diff,
                            updatedBy: opnameRec.updatedBy || getCurrentOpnameActorName(),
                            updatedAt: opnameRec.updatedAt || getFormattedNow()
                        }]
                    })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const result = await res.json().catch(() =&gt; ({}));
                if (result.success === false) {
                    throw new Error(result.error || 'Gagal menulis ke sheet Stok Opname');
                }
                return true;
            } catch (err) {
                console.warn('Gagal mengirim data stok opname ke Google Sheet:', err);
                showToast('Tersimpan di perangkat ini, namun gagal kirim ke sheet &quot;Stok Opname&quot; (cek Deploy Web App)', 'error');
                return false;
            }
        }

        async function clearOpnameInSpreadsheet() {

            try {
                const res = await fetch(webAppUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'resetOpname',
                        sheetId: SHEET_ID,
                        sheetName: OPNAME_SHEET_NAME,
                        resetBy: getCurrentOpnameActorName(),
                        resetAt: getFormattedNow()
                    })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const result = await res.json().catch(() =&gt; ({}));
                if (result.success === false) {
                    throw new Error(result.error || 'Gagal mereset sheet Stok Opname');
                }
                return true;
            } catch (err) {
                console.warn('Gagal mereset data stok opname di Google Sheet:', err);
                showToast('Data opname di perangkat ini sudah direset, namun gagal hapus di sheet &quot;Stok Opname&quot;', 'error');
                return false;

        }

        function renderOpnameTable() {
            const tbody = document.getElementById('opname-table-body');
            const paginationBar = document.getElementById('opname-pagination-bar');
            const pageInfoEl = document.getElementById('opname-page-info');
            const pageControlsEl = document.getElementById('opname-page-controls');
            const pageSizeSelect = document.getElementById('opname-page-size');
            if (!tbody) return;

            if (pageSizeSelect &amp;&amp; Number(pageSizeSelect.value) !== opnamePageSize) {
                pageSizeSelect.value = String(opnamePageSize);
            }

            const filteredProducts = getFilteredOpnameProducts();
            if (filteredProducts.length === 0) {
                tbody.innerHTML = `&lt;tr&gt;&lt;td colspan=&quot;6&quot; class=&quot;py-8 text-center text-sm text-slate-400&quot;&gt;Tidak ada produk yang cocok dengan pencarian&lt;/td&gt;&lt;/tr&gt;`;
                if (paginationBar) paginationBar.classList.add('hidden');
                return;
            }

            const totalItems = filteredProducts.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / opnamePageSize));
            if (opnameCurrentPage &gt; totalPages) opnameCurrentPage = totalPages;
            if (opnameCurrentPage &lt; 1) opnameCurrentPage = 1;

            const startIdx = (opnameCurrentPage - 1) * opnamePageSize;
            const endIdx = Math.min(startIdx + opnamePageSize, totalItems);
            const visibleProducts = filteredProducts.slice(startIdx, endIdx);

            tbody.innerHTML = visibleProducts.map((p) =&gt; {
                const sysStock = Number(p.stock) || 0;
                const rec = opnameRecords[p.id];
                const hasSavedOpname = rec !== undefined &amp;&amp; rec !== null;
                const physStock = hasSavedOpname ? Math.max(0, Number(rec.physicalStock) || 0) : 0;
                const diff = physStock - sysStock;
                const formattedSo = hasSavedOpname &amp;&amp; rec.updatedAt ? formatDisplayDateTime(rec.updatedAt) : '';
                const waktuSo = formattedSo ? escapeHtml(formattedSo) : '-';

                return `
                    &lt;tr onclick=&quot;openOpnameItemModal('${escapeAttr(p.id)}')&quot;
                        class=&quot;hover:bg-indigo-50/50 transition cursor-pointer&quot; data-opname-id=&quot;${escapeAttr(p.id)}&quot;&gt;
                        &lt;td class=&quot;py-3 px-4&quot;&gt;
                            &lt;div class=&quot;flex items-center gap-3&quot;&gt;
                                &lt;img src=&quot;${escapeAttr(p.image || createSvgPlaceholder('#eff6ff', '#2563eb', p.sku))}&quot; alt=&quot;&quot; loading=&quot;lazy&quot; class=&quot;w-10 h-10 rounded-xl object-contain bg-slate-50 border border-slate-200 shrink-0&quot;&gt;
                                &lt;div&gt;
                                    &lt;div class=&quot;font-bold text-slate-800&quot;&gt;${escapeHtml(p.name)}&lt;/div&gt;
                                    &lt;div class=&quot;text-xs text-slate-400&quot;&gt;${escapeHtml(p.sku)} • ${escapeHtml(p.unit || 'PCS')}&lt;/div&gt;
                                &lt;/div&gt;
                            &lt;/div&gt;
                        &lt;/td&gt;
                        &lt;td class=&quot;py-3 px-4 text-xs font-semibold text-slate-600&quot;&gt;${escapeHtml(p.rack || '-')}&lt;/td&gt;
                        &lt;td class=&quot;py-3 px-4 text-center font-bold text-slate-700 tabular-nums&quot;&gt;${sysStock}&lt;/td&gt;
                        &lt;td class=&quot;py-3 px-4 text-center&quot;&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;event.stopPropagation(); openOpnameItemModal('${escapeAttr(p.id)}')&quot;
                                class=&quot;inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl ${hasSavedOpname ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-slate-100 text-slate-800 border-slate-200'} hover:bg-indigo-100 hover:text-indigo-700 font-extrabold text-sm tabular-nums border transition cursor-pointer&quot;&gt;
                                &lt;span&gt;${physStock}&lt;/span&gt;
                                &lt;i data-lucide=&quot;pencil&quot; class=&quot;w-3.5 h-3.5 ${hasSavedOpname ? 'text-indigo-500' : 'text-slate-400'}&quot;&gt;&lt;/i&gt;
                            &lt;/button&gt;
                        &lt;/td&gt;
                        &lt;td class=&quot;py-3 px-4 text-center font-extrabold tabular-nums ${getDiffClassName(diff)}&quot;&gt;${formatDiffDisplay(diff)}&lt;/td&gt;
                        &lt;td class=&quot;py-3 px-4 text-center text-xs font-medium tabular-nums ${hasSavedOpname ? 'text-slate-700 font-semibold' : 'text-slate-400'}&quot;&gt;${waktuSo}&lt;/td&gt;
                    &lt;/tr&gt;
                `;
            }).join('');

            if (paginationBar) {
                if (totalItems &gt; opnamePageSize) {
                    paginationBar.classList.remove('hidden');
                    if (pageInfoEl) {
                        pageInfoEl.textContent = `Menampilkan ${startIdx + 1}-${endIdx} dari ${totalItems} produk`;
                    }
                    if (pageControlsEl) {
                        pageControlsEl.innerHTML = `
                            &lt;button type=&quot;button&quot; onclick=&quot;goToOpnamePage(${opnameCurrentPage - 1})&quot; ${opnameCurrentPage &lt;= 1 ? 'disabled' : ''}
                                class=&quot;px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-semibold disabled:opacity-40 cursor-pointer&quot;&gt;Prev&lt;/button&gt;
                            &lt;span class=&quot;px-2 text-xs font-bold text-slate-600&quot;&gt;Hal ${opnameCurrentPage} / ${totalPages}&lt;/span&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;goToOpnamePage(${opnameCurrentPage + 1})&quot; ${opnameCurrentPage &gt;= totalPages ? 'disabled' : ''}
                                class=&quot;px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-semibold disabled:opacity-40 cursor-pointer&quot;&gt;Next&lt;/button&gt;
                        `;
                    }
                } else {
                    paginationBar.classList.add('hidden');
                }
            }
            if (window.lucide) lucide.createIcons();
        }

            if (!prod) return;

            const sysStock = Number(prod.stock) || 0;
            const rec = opnameRecords[prod.id];
            const currentPhys = rec ? Math.max(0, Number(rec.physicalStock) || 0) : 0;

            document.getElementById('opname-modal-product-id').value = prod.id;
            document.getElementById('opname-modal-sku').textContent = prod.sku || 'SKU';
            document.getElementById('opname-modal-name').textContent = prod.name || '-';
            document.getElementById('opname-modal-meta').textContent = `Rak: ${prod.rack || '-'} • Stok Sistem: ${sysStock} ${prod.unit || 'PCS'}`;
            const qtyInput = document.getElementById('opname-modal-qty');

                if (qtyInput) {
                    qtyInput.focus();
                    qtyInput.select();

        async function handleOpnameItemSubmit(event) {
            event.preventDefault();
            const prodId = document.getElementById('opname-modal-product-id').value;
            const physStock = Math.max(0, parseInt(document.getElementById('opname-modal-qty').value, 10) || 0);
            const prod = products.find((p) =&gt; p.id === prodId);
            if (!prod) return;

            const sysStock = Number(prod.stock) || 0;
            const diff = physStock - sysStock;
            const waktuSo = getFormattedNow();

            const record = {
                physicalStock: physStock,
                diff: diff,
                updatedBy: getCurrentOpnameActorName(),
                updatedAt: waktuSo
            };
            opnameRecords[prodId] = record;
            saveOpnameToStorage();

            closeOpnameItemModal();
            refreshAllUI();

            const synced = await pushOpnameRecordToSpreadsheet(prod, record);
            showToast(
                synced
                    ? `Stok fisik ${prod.sku} disimpan ke sheet &quot;${OPNAME_SHEET_NAME}&quot; (${physStock}, selisih ${formatDiffDisplay(diff)})`
                    : `Stok fisik ${prod.sku} disimpan (${physStock}, selisih ${formatDiffDisplay(diff)})`,
                'success'
            );
        }

        // ==========================================
        function updateCartBadge() {
            const badge = document.getElementById('cart-badge-count');
            if (badge) {
                badge.textContent = String(cartItems.length);
            }
        }

        function addToCart(productId) {
            const prod = products.find((p) =&gt; p.id === productId);
            if (!prod) return;

            const existing = cartItems.find((item) =&gt; item.productId === prod.id);
            if (existing) {
                existing.qty += 1;
                showToast(`&quot;${prod.name}&quot; ditambahkan ke keranjang (Total: ${existing.qty})`, 'success');
            } else {
                cartItems.push({
                    productId: prod.id,
                    sku: prod.sku,
                    name: prod.name,
                    unit: prod.unit || 'PCS',
                    image: prod.image || createSvgPlaceholder('#eff6ff', '#2563eb', prod.sku),
                    qty: 1
                });
                showToast(`&quot;${prod.name}&quot; telah dimasukkan ke keranjang`, 'success');
            }

            updateCartBadge();
        }

        function openCartDrawer() {
            const modal = document.getElementById('cart-modal');
            const notifEl = document.getElementById('cart-modal-notification');
            const picInput = document.getElementById('cart-pic-name-input');
            if (notifEl) notifEl.classList.add('hidden');
            if (picInput) {
                picInput.classList.remove('ring-2', 'ring-rose-500', 'border-rose-400');
            }
            renderCartItems();
            if (modal) modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeCartDrawer() {
            const modal = document.getElementById('cart-modal');
            if (modal) modal.classList.add('hidden');
        }

        function renderCartItems() {
            const listEl = document.getElementById('cart-items-list');
            if (!listEl) return;

            updateCartBadge();

            if (cartItems.length === 0) {
                listEl.innerHTML = `&lt;p class=&quot;py-6 text-center text-sm text-slate-400&quot;&gt;Keranjang permintaan masih kosong.&lt;/p&gt;`;
                return;
            }

            listEl.innerHTML = cartItems.map((item, idx) =&gt; {
                const imgSrc = item.image || createSvgPlaceholder('#eff6ff', '#2563eb', item.sku);
                return `
                    &lt;div class=&quot;py-3 flex items-center justify-between gap-3&quot;&gt;
                        &lt;div class=&quot;flex items-center gap-3 min-w-0&quot;&gt;
                            &lt;img src=&quot;${escapeAttr(imgSrc)}&quot; alt=&quot;${escapeHtml(item.name)}&quot; class=&quot;w-12 h-12 rounded-xl object-contain bg-slate-50 border border-slate-200 shrink-0&quot;&gt;
                            &lt;div class=&quot;min-w-0&quot;&gt;
                                &lt;div class=&quot;text-[11px] font-bold text-indigo-600 uppercase&quot;&gt;${escapeHtml(item.sku)}&lt;/div&gt;
                                &lt;div class=&quot;text-sm font-bold text-slate-800 truncate&quot;&gt;${escapeHtml(item.name)}&lt;/div&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;flex items-center gap-2 shrink-0&quot;&gt;
                            &lt;input type=&quot;number&quot; min=&quot;1&quot; value=&quot;${Number(item.qty) || 1}&quot;
                                onfocus=&quot;this.select()&quot; onclick=&quot;this.select()&quot;
                                onchange=&quot;updateCartItemQty(${idx}, this.value)&quot;
                                class=&quot;w-16 px-2 py-1.5 text-center text-sm font-bold border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500&quot;&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;removeCartItem(${idx})&quot; title=&quot;Hapus item&quot;
                                class=&quot;p-2 text-rose-500 hover:bg-rose-50 rounded-xl transition&quot;&gt;
                                &lt;i data-lucide=&quot;trash-2&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                            &lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        function updateCartItemQty(index, newQty) {
            if (!cartItems[index]) return;
            const parsed = Math.max(1, parseInt(newQty, 10) || 1);
            cartItems[index].qty = parsed;
            renderCartItems();
        }

        function removeCartItem(index) {
            cartItems.splice(index, 1);
            renderCartItems();
        }

        function clearCart() {
            cartItems = [];
            updateCartBadge();
            renderCartItems();
            closeCartDrawer();
            showToast('Keranjang permintaan telah dikosongkan', 'success');
        }

        async function submitCartToRequests() {
            if (cartItems.length === 0) {
                showToast('Keranjang masih kosong, tambahkan barang terlebih dahulu', 'error');
                return;
            }

            const picNameInput = document.getElementById('cart-pic-name-input');
            const divisionInput = document.getElementById('cart-division-input');
            const notesInput = document.getElementById('cart-usage-notes-input');
            const picName = (picNameInput ? picNameInput.value : '').trim();
            const division = (divisionInput ? divisionInput.value : '').trim() || 'General Warehouse';
            const notes = (notesInput ? notesInput.value : '').trim();

            if (!picName) {
                showToast('Nama PIC wajib diisi secara manual sebelum mengajukan permintaan', 'error');
                if (picNameInput) {
                    picNameInput.focus();
                    picNameInput.classList.add('ring-2', 'ring-rose-500', 'border-rose-400');
                }
                return;
            }
            if (picNameInput) {
                picNameInput.classList.remove('ring-2', 'ring-rose-500', 'border-rose-400');
            }

            const reqId = getNextRequestNumber();
            const timestamp = getFormattedNow();
            const itemCount = cartItems.length;
            const actorUsername = String(currentUser?.Username || '').trim();
            const combinedNotes = notes ? `${notes} • PIC: ${picName}` : `PIC: ${picName}`;
            const createdEntries = [];

            cartItems.forEach((item) =&gt; {
                const qty = Math.max(1, Number(item.qty) || 1);
                const entry = {
                    id: reqId,
                    date: timestamp,
                    division,
                    picName,
                    createdBy: actorUsername,
                    productId: item.productId,
                    productName: item.name,
                    qty,
                    approvedQty: qty,
                    notes: combinedNotes,
                    status: 'Pending'
                };
                requests.unshift(entry);
                createdEntries.push(entry);
            });

            saveRequests();
            cartItems = [];
            updateCartBadge();
            if (picNameInput) picNameInput.value = '';
            if (notesInput) notesInput.value = '';

            closeCartDrawer();
            refreshAllUI();

            const synced = await pushRequestsToSpreadsheet(createdEntries);
            showToast(
                synced
                    ? `Permintaan ${reqId} (${itemCount} barang, PIC: ${picName}) tersimpan ke sheet &quot;${REQUESTS_SHEET_NAME}&quot;`
                    : `Permintaan ${reqId} (${itemCount} barang, PIC: ${picName}) berhasil diajukan`,
                'success'
            );
        }

        function openNonCodeRequestModal() {
            const modal = document.getElementById('non-code-modal');
            if (modal) modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeNonCodeRequestModal() {
            const modal = document.getElementById('non-code-modal');
            if (modal) modal.classList.add('hidden');
        }

        async function handleNonCodeRequestSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('noncode-name').value.trim();
            const division = document.getElementById('noncode-division').value.trim();
            const qty = Math.max(1, parseInt(document.getElementById('noncode-qty').value, 10) || 1);
            const usageNotes = (document.getElementById('noncode-notes')?.value || '').trim();

            if (!name || !division) {
                showToast('Nama barang dan divisi wajib diisi', 'error');
                return;
            }

            const reqId = getNextRequestNumber();
            const combinedNotes = usageNotes
                ? `${usageNotes} • Request Barang Non Code`
                : 'Request Barang Non Code';

            const entry = {
                id: reqId,
                date: getFormattedNow(),
                division,
                picName: getCurrentOpnameActorName(),
                createdBy: String(currentUser?.Username || '').trim(),
                productId: null,
                productName: `${name} (Non-Code)`,
                qty,
                approvedQty: qty,
                notes: combinedNotes,
                status: 'Pending'
            };
            requests.unshift(entry);

            saveRequests();
            document.getElementById('noncode-name').value = '';
            document.getElementById('noncode-division').value = '';
            document.getElementById('noncode-qty').value = '1';
            const notesEl = document.getElementById('noncode-notes');
            if (notesEl) notesEl.value = '';
            closeNonCodeRequestModal();
            refreshAllUI();

            const synced = await pushRequestsToSpreadsheet([entry]);
            showToast(
                synced
                    ? `Request Non-Code ${reqId} tersimpan ke sheet &quot;${REQUESTS_SHEET_NAME}&quot;`
                    : `Request Non-Code ${reqId} berhasil diajukan`,
                'success'
            );
        }

        function openNewRequestModal() {
            const select = document.getElementById('req-product-id');
            if (select) {
                select.innerHTML = products.slice(0, 500).map((p) =&gt;
                    `&lt;option value=&quot;${escapeAttr(p.id)}&quot;&gt;${escapeHtml(p.sku)} — ${escapeHtml(p.name)} (Stok: ${Number(p.stock) || 0})&lt;/option&gt;`
                ).join('');
            }
            const modal = document.getElementById('new-request-modal');
            if (modal) modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeNewRequestModal() {
            const modal = document.getElementById('new-request-modal');
            if (modal) modal.classList.add('hidden');
        }

        async function handleCreateRequest(event) {
            event.preventDefault();
            const division = document.getElementById('req-division').value.trim();
            const prodId = document.getElementById('req-product-id').value;
            const qty = Math.max(1, parseInt(document.getElementById('req-qty').value, 10) || 1);

            const prod = products.find((p) =&gt; p.id === prodId);
            if (!division || !prod) {
                showToast('Lengkapi data permintaan terlebih dahulu', 'error');
                return;
            }

            const reqId = getNextRequestNumber();
            const entry = {
                id: reqId,
                date: getFormattedNow(),
                division,
                picName: getCurrentOpnameActorName(),
                createdBy: String(currentUser?.Username || '').trim(),
                productId: prod.id,
                productName: prod.name,
                qty,
                approvedQty: qty,
                notes: '',
                status: 'Pending'
            };
            requests.unshift(entry);

            saveRequests();
            document.getElementById('req-division').value = '';
            document.getElementById('req-qty').value = '1';
            closeNewRequestModal();
            refreshAllUI();

            const synced = await pushRequestsToSpreadsheet([entry]);
            showToast(
                synced
                    ? `Permintaan ${reqId} tersimpan ke sheet &quot;${REQUESTS_SHEET_NAME}&quot;`
                    : `Permintaan ${reqId} berhasil dibuat`,
                'success'
            );
        }

        function renderRequestsTable() {
            const tbody = document.getElementById('requests-table-body');
            if (!tbody) return;

            const isAdmin = isCurrentUserAdmin();
            const statusFilter = document.getElementById('filter-request-status')?.value || 'ALL';
            const roleRequests = getRoleFilteredRequests();
            const filtered = roleRequests.filter((r) =&gt; statusFilter === 'ALL' || r.status === statusFilter);

            if (filtered.length === 0) {
                tbody.innerHTML = `&lt;tr&gt;&lt;td colspan=&quot;7&quot; class=&quot;py-8 text-center text-sm text-slate-400&quot;&gt;Tidak ada data permintaan untuk user ini&lt;/td&gt;&lt;/tr&gt;`;
                return;
            }

            tbody.innerHTML = filtered.map((req, rowIdx) =&gt; {
                const qty = Math.max(1, Number(req.qty) || 1);
                const approvedQty = Math.max(0, Number(req.approvedQty ?? qty) || 0);
                const statusBadge = req.status === 'Approved'
                    ? 'bg-emerald-100 text-emerald-700'
                    : req.status === 'Rejected'
                        ? 'bg-rose-100 text-rose-700'
                        : 'bg-amber-100 text-amber-800';

                const isPending = req.status === 'Pending';
                const canApproveOrReject = isAdmin &amp;&amp; isPending;

                const approveQtyCellHtml = isAdmin
                    ? `
                        &lt;div class=&quot;inline-flex items-center justify-center gap-1&quot;&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;adjustApproveQty(${rowIdx}, -1)&quot; ${!canApproveOrReject ? 'disabled' : ''}
                                class=&quot;w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 font-bold text-sm flex items-center justify-center transition&quot;&gt;-&lt;/button&gt;
                            &lt;input type=&quot;number&quot; min=&quot;0&quot; value=&quot;${approvedQty}&quot; ${!canApproveOrReject ? 'disabled' : ''}
                                onfocus=&quot;this.select()&quot; onclick=&quot;this.select()&quot;
                                onchange=&quot;setApproveQty(${rowIdx}, this.value)&quot;
                                class=&quot;approve-qty-input w-14 px-1.5 py-1 text-center text-xs font-extrabold border border-slate-300 rounded-lg disabled:bg-slate-50 disabled:text-slate-500&quot;&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;adjustApproveQty(${rowIdx}, 1)&quot; ${!canApproveOrReject ? 'disabled' : ''}
                                class=&quot;w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 font-bold text-sm flex items-center justify-center transition&quot;&gt;+&lt;/button&gt;
                        &lt;/div&gt;
                    `
                    : `&lt;span class=&quot;font-bold text-slate-700 tabular-nums&quot;&gt;${approvedQty}&lt;/span&gt;`;

                const actionCellHtml = canApproveOrReject
                    ? `
                        &lt;div class=&quot;inline-flex items-center gap-1.5&quot;&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;updateRequestStatus(${rowIdx}, 'Approved')&quot;
                                class=&quot;px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition cursor-pointer&quot;&gt;Approve&lt;/button&gt;
                            &lt;button type=&quot;button&quot; onclick=&quot;updateRequestStatus(${rowIdx}, 'Rejected')&quot;
                                class=&quot;px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition cursor-pointer&quot;&gt;Reject&lt;/button&gt;
                        &lt;/div&gt;
                    `
                    : `&lt;span class=&quot;text-xs font-medium text-slate-400&quot;&gt;${isPending ? 'Menunggu Admin' : 'Selesai'}&lt;/span&gt;`;

                return `
                    &lt;tr class=&quot;hover:bg-slate-50/80 transition&quot; data-req-row=&quot;${rowIdx}&quot;&gt;
                        &lt;td class=&quot;py-3.5 px-4 align-top&quot;&gt;
                            &lt;div class=&quot;font-extrabold text-slate-800&quot;&gt;${escapeHtml(req.id)}&lt;/div&gt;
                            &lt;div class=&quot;text-xs text-slate-400 tabular-nums&quot;&gt;${escapeHtml(req.date || '')}&lt;/div&gt;
                        &lt;/td&gt;
                        &lt;td class=&quot;py-3.5 px-4 align-top font-semibold text-slate-700&quot;&gt;${escapeHtml(req.division)}&lt;/td&gt;
                        &lt;td class=&quot;py-3.5 px-4 align-top&quot;&gt;
                            &lt;div class=&quot;font-bold text-slate-800&quot;&gt;${escapeHtml(req.productName)}&lt;/div&gt;
                            ${req.notes ? `&lt;div class=&quot;text-xs text-slate-400 mt-0.5&quot;&gt;${escapeHtml(req.notes)}&lt;/div&gt;` : ''}
                        &lt;/td&gt;
                        &lt;td class=&quot;py-3.5 px-4 align-top text-center font-extrabold text-slate-800 tabular-nums&quot;&gt;${qty}&lt;/td&gt;
                        &lt;td class=&quot;py-3.5 px-4 align-top text-center&quot;&gt;${approveQtyCellHtml}&lt;/td&gt;
                        &lt;td class=&quot;py-3.5 px-4 align-top text-center&quot;&gt;
                            &lt;span class=&quot;px-2.5 py-1 rounded-full text-xs font-bold ${statusBadge}&quot;&gt;${escapeHtml(req.status)}&lt;/span&gt;
                        &lt;/td&gt;
                        &lt;td class=&quot;py-3.5 px-4 align-top text-right&quot;&gt;${actionCellHtml}&lt;/td&gt;
                    &lt;/tr&gt;
                `;
            }).join('');
        }

        function adjustApproveQty(rowIdx, delta) {
            if (!isCurrentUserAdmin()) return;
            const statusFilter = document.getElementById('filter-request-status')?.value || 'ALL';
            const filtered = getRoleFilteredRequests().filter((r) =&gt; statusFilter === 'ALL' || r.status === statusFilter);
            const target = filtered[rowIdx];
            if (!target) return;

            const current = Math.max(0, Number(target.approvedQty ?? target.qty) || 0);
            target.approvedQty = Math.max(0, current + delta);
            saveRequests();
            renderRequestsTable();
        }

        function setApproveQty(rowIdx, value) {
            if (!isCurrentUserAdmin()) return;
            const statusFilter = document.getElementById('filter-request-status')?.value || 'ALL';
            const filtered = getRoleFilteredRequests().filter((r) =&gt; statusFilter === 'ALL' || r.status === statusFilter);
            const target = filtered[rowIdx];
            if (!target) return;

            target.approvedQty = Math.max(0, parseInt(value, 10) || 0);
            saveRequests();
            renderRequestsTable();
        }

        async function updateRequestStatus(rowIdx, newStatus) {
            if (!isCurrentUserAdmin()) {
                showToast('Aksi Approve/Reject hanya tersedia untuk role admin', 'error');
                return;
            }
            const statusFilter = document.getElementById('filter-request-status')?.value || 'ALL';
            const filtered = getRoleFilteredRequests().filter((r) =&gt; statusFilter === 'ALL' || r.status === statusFilter);
            const target = filtered[rowIdx];
            if (!target) return;

            const rowEl = document.querySelector(`#requests-table-body tr[data-req-row=&quot;${rowIdx}&quot;]`);
            const inputEl = rowEl ? rowEl.querySelector('.approve-qty-input') : null;
            const approveQty = Math.max(0, parseInt(inputEl ? inputEl.value : (target.approvedQty ?? target.qty), 10) || 0);

            target.approvedQty = approveQty;
            target.status = newStatus;

            let matchedSku = '';
            if (target.productId) {
                const prod = products.find((p) =&gt; p.id === target.productId);
                if (prod) {
                    matchedSku = prod.sku || '';
                    if (newStatus === 'Approved' &amp;&amp; approveQty &gt; 0) {
                        prod.stock = Math.max(0, (Number(prod.stock) || 0) - approveQty);
                        saveProducts();
                    }
                }
            }

            saveRequests();
            refreshAllUI();

            const synced = await pushRequestStatusToSpreadsheet(target, matchedSku);
            showToast(
                synced
                    ? `${target.id} di-${newStatus === 'Approved' ? 'Approve' : 'Reject'} &amp; diperbarui di sheet &quot;${REQUESTS_SHEET_NAME}&quot;`
                    : `${target.id} (${target.productName}) di-${newStatus === 'Approved' ? 'Approve' : 'Reject'} dengan qty ${approveQty}`,
                'success'
            );
        }

        // ==========================================
        // 8. PESAN, CSV EXPORT &amp; CONFIRM MODAL
        // ==========================================
        function openMessageModal() {
            const modal = document.getElementById('message-modal');
            if (modal) modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeMessageModal() {
            const modal = document.getElementById('message-modal');
            if (modal) modal.classList.add('hidden');
        }

        function handleSendMessage(event) {
            event.preventDefault();
            const target = document.getElementById('msg-target').value;
            const body = document.getElementById('msg-body').value.trim();
            if (!body) return;

            document.getElementById('msg-body').value = '';
            closeMessageModal();
            showToast(`Pesan terkirim ke &quot;${target}&quot;`, 'success');
        }

        function exportToCSV() {
            const headers = ['SKU', 'Nama Barang', 'Kategori', 'Rak', 'Stok', 'Satuan', 'Keterangan'];
            const rows = products.map((p) =&gt; [
                p.sku,
                p.name,
                p.category,
                p.rack,
                Number(p.stock) || 0,
                p.unit || 'PCS',
                p.notes || ''
            ]);

            const csvContent = [headers, ...rows]
                .map((row) =&gt; row.map((cell) =&gt; `&quot;${String(cell ?? '').replace(/&quot;/g, '&quot;&quot;')}&quot;`).join(','))
                .join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `katalog_inventaris_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('File CSV katalog produk berhasil diunduh', 'success');
        }

        function openResetConfirmModal() {
            openConfirmModal(
                'Reset Data',
                'Semua perubahan lokal pada produk dan permintaan akan dikembalikan ke data awal. Lanjutkan?',
                () =&gt; {
                    products = [...SAMPLE_PRODUCTS];
                    requests = [...SAMPLE_REQUESTS];
                    cartItems = [];
                    saveProducts();
                    saveRequests();
                    closeConfirmModal();
                    refreshAllUI();
                    showToast('Data berhasil direset', 'success');
                }
            );
        }

        function openConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const titleEl = document.getElementById('confirm-title');
            const msgEl = document.getElementById('confirm-message');
            const actionBtn = document.getElementById('confirm-action-btn');

            if (titleEl) titleEl.textContent = title;
            if (msgEl) msgEl.textContent = message;
            if (actionBtn) {
                actionBtn.onclick = () =&gt; {
                    if (typeof onConfirm === 'function') onConfirm();
                };
            }
            if (modal) modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            if (modal) modal.classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', initApp);
